.anniversary{width:116px;height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:13px;transform:none;right:-16px;top:-12px;text-align:center}
.anniversary strong{font-size:49px;line-height:1;letter-spacing:-3px;padding-right:3px}
.anniversary span{font-size:9px;line-height:1.35;letter-spacing:.035em;max-width:84px;text-align:center}
.language-switch{display:flex;align-items:center;gap:3px;padding-left:17px;border-left:1px solid #d9e1dc;flex-shrink:0}
.language-switch button{background:transparent;color:#66776e;font-size:12px;font-weight:600;padding:8px 7px;min-height:38px;border-radius:3px;transition:background .2s,color .2s}
.language-switch button:hover{background:#edf3ef;color:#173b2e}
.language-switch button.active{background:#0b4536;color:#fff}
html[lang=ru] .hero-copy h1{font-size:clamp(1.8rem,2.65vw,2.7rem)}
html[lang=en] .hero-copy h1{font-size:clamp(1.8rem,2.8vw,2.8rem)}
.header{gap:20px}.nav{gap:20px}
.facts-strip>div,.facts-strip>a{min-width:0}.facts-strip strong{flex-wrap:wrap;line-height:1.45}
@media(max-width:1100px){.nav{gap:12px;font-size:12px}.nav-register{padding:8px 10px}.language-switch{padding-left:10px}.header{gap:12px}}
@media(max-width:900px){.header{height:76px;padding:8px 4%;gap:8px}.university-logo{width:82px;height:50px}.faculty-logo{width:45px;height:45px}.logos{gap:10px}.logo-divider{height:30px}.language-switch{margin-left:auto;padding-left:0;border:0;gap:1px}.language-switch button{padding:8px 6px;font-size:11px}.menu-toggle{display:flex;padding:7px}.nav{display:none;position:absolute;left:0;right:0;top:76px;background:white;padding:25px 6%;border-top:1px solid #e2e7e2;box-shadow:0 20px 30px #12352015}.nav.is-open{display:flex;flex-direction:column;align-items:stretch;font-size:16px;gap:15px}.nav-register{justify-content:space-between}}
@media(max-width:800px){html[lang=ru] .hero-copy h1,html[lang=en] .hero-copy h1{font-size:clamp(1.45rem,4.5vw,2.5rem)}.dedication{line-height:1.45}.hero-copy>.button{max-width:100%}.count-label{flex-shrink:1}.clock{flex-shrink:0}.clock span{font-size:10px}}
@media(max-width:360px){.university-logo{width:70px;height:45px}.faculty-logo{width:40px;height:40px}.logos{gap:7px}.language-switch button{font-size:10px;padding:8px 5px}.header{gap:6px}.hero-copy h1,html[lang=ru] .hero-copy h1,html[lang=en] .hero-copy h1{font-size:1.4rem;line-height:1.2}.hero-copy>.button{font-size:11px;gap:10px}.hero-topline{margin-bottom:12px}.count-label{max-width:115px}.clock{gap:12px}}

/* The supplied portrait is displayed whole, without a decorative frame. */
.hero-photo{position:relative;border:0;padding:0;border-radius:0;box-shadow:none}
.hero-photo>img{display:block;width:100%;height:auto;aspect-ratio:1024/682;object-fit:contain;border:0;border-radius:0}
.hero-portrait{padding-top:98px;max-width:440px}
.hero-portrait .anniversary{top:-42px;right:0}
.about{grid-template-columns:.65fr 1.35fr;gap:6%}.about-copy>p{font-size:16px;line-height:1.8}.scientist{align-items:start}.scientist p:not(.scientist-role){font-size:16px;line-height:1.8}.registration-intro>p{font-size:16px;line-height:1.75}.faq details>div p{font-size:16px;line-height:1.8}
@media(max-width:800px){.about{grid-template-columns:1fr}}

.album-section{background:#f3f7f4;border-top:1px solid var(--border)}
.album{display:grid;grid-template-columns:.7fr 1.3fr;gap:7%;align-items:center}
.album-heading h2{margin-bottom:18px}.album-heading p{max-width:300px;color:#5e7468;font-size:16px;line-height:1.7}
.album-viewer{position:relative;aspect-ratio:16/9;background:#0a352b;overflow:hidden;box-shadow:0 18px 50px #0b352b22}
.album-viewer img{width:100%;height:100%;object-fit:cover;animation:albumReveal .65s ease both}
.album-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid #fff8;background:#0a352bcc;color:#fff;font-size:30px;line-height:1;border-radius:50%;display:grid;place-items:center}
.album-arrow:hover{background:var(--gold);color:#16392d}.album-prev{left:18px}.album-next{right:18px}
.album-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 12px;background:#0a352bb8;border-radius:20px}
.album-dots button{width:8px;height:8px;padding:0;border-radius:50%;background:#fff8}.album-dots button.active{background:var(--gold);transform:scale(1.35)}
@keyframes albumReveal{from{opacity:.25;transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
@media(max-width:800px){.album{grid-template-columns:1fr;gap:28px}.album-heading p{max-width:100%}.album-viewer{aspect-ratio:4/3}.album-arrow{width:38px;height:38px;font-size:25px}}

043D\u044B\u043C\u0435\u043D \u049B\u0430\u0442\u0430\u0440, \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u044F\u043B\u044B\u049B \u0431\u0456\u043B\u0456\u043C \u0431\u0435\u0440\u0443, \u0431\u0438\u043E\u0430\u043B\u0443\u0430\u043D\u0442\u04AF\u0440\u043B\u0456\u043B\u0456\u043A\u0442\u0456 \u0441\u0430\u049B\u0442\u0430\u0443, \u0442\u04B1\u0440\u0430\u049B\u0442\u044B \u0434\u0430\u043C\u0443, \u0446\u0438\u0444\u0440\u043B\u044B\u049B \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044F\u043B\u0430\u0440\u0434\u044B \u0431\u0456\u043B\u0456\u043C \u0431\u0435\u0440\u0443 \u04AF\u0434\u0435\u0440\u0456\u0441\u0456\u043D\u0435 \u0435\u043D\u0433\u0456\u0437\u0443 \u043C\u04D9\u0441\u0435\u043B\u0435\u043B\u0435\u0440\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0493\u044B\u043B\u044B\u043C\u0438 \u043F\u0456\u043A\u0456\u0440 \u0430\u043B\u043C\u0430\u0441\u0443, \u043E\u0442\u0430\u043D\u0434\u044B\u049B \u0436\u04D9\u043D\u0435 \u0448\u0435\u0442\u0435\u043B\u0434\u0456\u043A \u0493\u0430\u043B\u044B\u043C\u0434\u0430\u0440 \u043C\u0435\u043D \u043F\u0435\u0434\u0430\u0433\u043E\u0433\u0442\u0435\u0440\u0434\u0456\u04A3 \u0493\u044B\u043B\u044B\u043C\u0438 \u044B\u043D\u0442\u044B\u043C\u0430\u049B\u0442\u0430\u0441\u0442\u044B\u0493\u044B\u043D \u043D\u044B\u0493\u0430\u0439\u0442\u0443 \u0436\u04D9\u043D\u0435 \u0436\u0430\u0441 \u0437\u0435\u0440\u0442\u0442\u0435\u0443\u0448\u0456\u043B\u0435\u0440\u0434\u0456\u04A3 \u0493\u044B\u043B\u044B\u043C\u0438 \u04D9\u043B\u0435\u0443\u0435\u0442\u0456\u043D \u0434\u0430\u043C\u044B\u0442\u0443.","\u049A\u0430\u0442\u044B\u0441\u0443\u0448\u044B\u043B\u0430\u0440. \u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F\u0493\u0430 \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u044F \u0436\u04D9\u043D\u0435 \u0436\u0430\u0440\u0430\u0442\u044B\u043B\u044B\u0441\u0442\u0430\u043D\u0443 \u0493\u0430\u043B\u044B\u043C\u0434\u0430\u0440\u044B, \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u044F\u043B\u044B\u049B \u0431\u0456\u043B\u0456\u043C \u0431\u0435\u0440\u0443, \u0431\u0438\u043E\u0430\u043B\u0443\u0430\u043D\u0442\u04AF\u0440\u043B\u0456\u043B\u0456\u043A\u0442\u0456 \u0441\u0430\u049B\u0442\u0430\u0443 \u0436\u04D9\u043D\u0435 \u049B\u043E\u0440\u0493\u0430\u0443, \u0493\u044B\u043B\u044B\u043C\u0438 \u0437\u0435\u0440\u0442\u0442\u0435\u0443\u043B\u0435\u0440 \u043C\u0435\u043D \u0446\u0438\u0444\u0440\u043B\u044B\u049B \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044F\u043B\u0430\u0440 \u0431\u0430\u0493\u044B\u0442\u0442\u0430\u0440\u044B\u043D\u0434\u0430 \u0437\u0435\u0440\u0442\u0442\u0435\u0443 \u0436\u04AF\u0440\u0433\u0456\u0437\u0435\u0442\u0456\u043D \u043E\u0442\u0430\u043D\u0434\u044B\u049B \u0436\u04D9\u043D\u0435 \u0448\u0435\u0442\u0435\u043B\u0434\u0456\u043A \u0493\u0430\u043B\u044B\u043C\u0434\u0430\u0440, \u043E\u049B\u044B\u0442\u0443\u0448\u044B\u043B\u0430\u0440, \u0437\u0435\u0440\u0442\u0442\u0435\u0443\u0448\u0456\u043B\u0435\u0440, \u0434\u043E\u043A\u0442\u043E\u0440\u0430\u043D\u0442\u0442\u0430\u0440, \u043C\u0430\u0433\u0438\u0441\u0442\u0440\u0430\u043D\u0442\u0442\u0430\u0440 \u043C\u0435\u043D \u0436\u0430\u0441 \u0493\u0430\u043B\u044B\u043C\u0434\u0430\u0440, \u0441\u043E\u043D\u0434\u0430\u0439-\u0430\u049B \u0431\u0456\u043B\u0456\u043C \u0431\u0435\u0440\u0443 \u04B1\u0439\u044B\u043C\u0434\u0430\u0440\u044B\u043D\u044B\u04A3 \u04D9\u043A\u0456\u043C\u0448\u0456\u043B\u0456\u043A \u049B\u044B\u0437\u043C\u0435\u0442\u043A\u0435\u0440\u043B\u0435\u0440\u0456 \u049B\u0430\u0442\u044B\u0441\u0430 \u0430\u043B\u0430\u0434\u044B."],registration:["\u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F\u0493\u0430 \u0442\u0456\u0440\u043A\u0435\u043B\u0443 \u0442\u04D9\u0440\u0442\u0456\u0431\u0456, \u043F.\u0493.\u0434., \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u043E\u0440-\u0430\u043A\u0430\u0434\u0435\u043C\u0438\u043A \u0416.\u0411.\u0427\u0438\u043B\u0434\u0438\u0431\u0430\u0435\u0432\u0442\u044B\u04A3 \u043C\u0435\u0440\u0435\u0439\u0442\u043E\u0439\u044B\u043D\u0430 \u0430\u0440\u043D\u0430\u043B\u0493\u0430\u043D \u049B\u04B1\u0442\u0442\u044B\u049B\u0442\u0430\u0443\u043B\u0430\u0440 \u043C\u0435\u043D \u0435\u0441\u0442\u0435\u043B\u0456\u043A \u0445\u0430\u0442\u0442\u0430\u0440\u044B\u043D \u0436\u043E\u043B\u0434\u0430\u0443 \u0436\u0430\u0439\u043B\u044B \u043C\u04D9\u043B\u0456\u043C\u0435\u0442\u0442\u0435\u0440, \u0441\u043E\u043D\u0434\u0430\u0439-\u0430\u049B \u0431\u0430\u0441\u049B\u0430 \u0434\u0430 \u0442\u043E\u043B\u044B\u049B \u0430\u049B\u043F\u0430\u0440\u0430\u0442 \u0456\u0441-\u0448\u0430\u0440\u0430\u043D\u044B\u04A3 \u0440\u0435\u0441\u043C\u0438 \u0441\u0430\u0439\u0442\u044B\u043D\u0434\u0430 (\u043D\u0435\u043C\u0435\u0441\u0435 \u049A\u043E\u0441\u044B\u043C\u0448\u0430 1) \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043B\u0433\u0435\u043D. \u049A\u0430\u0442\u044B\u0441\u0443\u0448\u044B\u043B\u0430\u0440 \u0442\u0456\u0440\u043A\u0435\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B\u043D 2026 \u0436\u044B\u043B\u0434\u044B\u04A3 20 \u049B\u0430\u0437\u0430\u043D\u0493\u0430 \u0434\u0435\u0439\u0456\u043D \u0442\u043E\u043B\u0442\u044B\u0440\u044B\u043F, \u04B1\u0439\u044B\u043C\u0434\u0430\u0441\u0442\u044B\u0440\u0443 \u043A\u043E\u043C\u0438\u0442\u0435\u0442\u0456\u043D\u0435 \u0436\u043E\u043B\u0434\u0430\u0443\u044B \u049B\u0430\u0436\u0435\u0442. \u049A\u0430\u0442\u044B\u0441\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B\u04A3 \u0442\u0456\u0440\u043A\u0435\u043B\u0443 \u0436\u04D9\u043D\u0435 \u043C\u0430\u049B\u0430\u043B\u0430 \u0436\u0430\u0440\u0438\u044F\u043B\u0430\u0443 \u0436\u0430\u0440\u043D\u0430\u0441\u044B \u04E9\u0437\u0434\u0435\u0440\u0456\u043D\u0456\u04A3 \u049B\u0430\u0442\u044B\u0441\u0443\u044B \u0440\u0430\u0441\u0442\u0430\u043B\u0493\u0430\u043D\u044B \u0442\u0443\u0440\u0430\u043B\u044B \u0445\u0430\u0431\u0430\u0440\u043B\u0430\u043D\u0434\u044B\u0440\u0443 \u0445\u0430\u0442\u044B\u043D \u0430\u043B\u0493\u0430\u043D\u043D\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u0442\u04E9\u043B\u0435\u0439\u0434\u0456."],format:["\u0416\u04B1\u043C\u044B\u0441 \u0444\u043E\u0440\u043C\u0430\u0442\u044B: \u0433\u0438\u0431\u0440\u0438\u0434\u0442\u0456 (\u043E\u0444\u0444\u043B\u0430\u0439\u043D - \u043E\u043D\u043B\u0430\u0439\u043D). \u0411\u0430\u0493\u0434\u0430\u0440\u043B\u0430\u043C\u0430\u0434\u0430 \u0448\u0430\u049B\u044B\u0440\u044B\u043B\u0493\u0430\u043D \u0441\u043F\u0438\u043A\u0435\u0440\u043B\u0435\u0440\u0434\u0456\u04A3 \u043F\u043B\u0435\u043D\u0430\u0440\u043B\u044B\u049B \u0431\u0430\u044F\u043D\u0434\u0430\u043C\u0430\u043B\u0430\u0440\u044B, \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C \u0442\u0430\u049B\u044B\u0440\u044B\u043F\u0442\u044B\u049B \u0441\u0435\u043A\u0446\u0438\u044F\u043B\u0430\u0440 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0434\u0456."],publication:["\u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0431\u0430\u044F\u043D\u0434\u0430\u043C\u0430\u043B\u0430\u0440 \u043C\u0435\u043D \u0434\u043E\u043A\u043B\u0430\u0434\u0442\u0430\u0440 \u0436\u0438\u043D\u0430\u0493\u044B \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u0434\u044B\u049B \u0444\u043E\u0440\u043C\u0430\u0442\u0442\u0430 \u0434\u0430\u0439\u044B\u043D\u0434\u0430\u043B\u044B\u043F, \u0436\u0430\u0440\u0438\u044F\u043B\u0430\u043D\u0430\u0434\u044B.","\u04B0\u0439\u044B\u043C\u0434\u0430\u0441\u0442\u044B\u0440\u0443 \u043A\u043E\u043C\u0438\u0442\u0435\u0442\u0456 \u043C\u0430\u049B\u0430\u043B\u0430\u043B\u0430\u0440\u0434\u044B \u0436\u0430\u0440\u0438\u044F\u043B\u0430\u043D\u0493\u0430\u043D \u0442\u0430\u049B\u044B\u0440\u044B\u043F\u0442\u0430\u0440\u0493\u0430 \u0436\u04D9\u043D\u0435 \u0431\u0435\u0437\u0435\u043D\u0434\u0456\u0440\u0443 \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440\u044B\u043D\u0430 \u0441\u04D9\u0439\u043A\u0435\u0441 \u0456\u0440\u0456\u043A\u0442\u0435\u0443 \u049B\u04B1\u049B\u044B\u0493\u044B\u043D \u04E9\u0437 \u0436\u0430\u0443\u0430\u043F\u043A\u0435\u0440\u0448\u0456\u043B\u0456\u0433\u0456\u043D\u0435 \u0430\u043B\u0430\u0434\u044B."],requirements:["\u041C\u0430\u049B\u0430\u043B\u0430\u043B\u0430\u0440\u0434\u044B \u0434\u0430\u0439\u044B\u043D\u0434\u0430\u0443 \u043A\u0435\u0437\u0456\u043D\u0434\u0435 \u043A\u0435\u043B\u0435\u0441\u0456 \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440\u0434\u044B \u0441\u0430\u049B\u0442\u0430\u0443 \u049B\u0430\u0436\u0435\u0442: \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u0434\u044B\u049B \u043D\u04B1\u0441\u049B\u0430\u0434\u0430 \u0442\u0435\u0440\u0456\u043B\u0433\u0435\u043D \u043C\u04D9\u0442\u0456\u043D \u043A\u04E9\u043B\u0435\u043C\u0456 10 \u0431\u0435\u0442\u0442\u0435\u043D \u0430\u0441\u043F\u0430\u0443\u044B \u0442\u0438\u0456\u0441. \u0428\u0440\u0438\u0444\u0442 \u2013 Times New Roman, \u049B\u0430\u0440\u0456\u043F \u04E9\u043B\u0448\u0435\u043C\u0456 \u2013 14; \u0436\u043E\u043B\u0430\u0440\u0430\u043B\u044B\u049B \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B \u2013 1; \u043C\u04D9\u0442\u0456\u043D\u0434\u0456 \u0435\u043D\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u0443; \u0430\u0431\u0437\u0430\u0446 \u0448\u0435\u0433\u0456\u043D\u0456\u0441\u0456 \u2013 1 \u0441\u043C; \u0431\u0435\u0442 \u0431\u0430\u0493\u044B\u0442\u044B \u2013 \u043F\u043E\u0440\u0442\u0440\u0435\u0442\u0442\u0456\u043A, \u0436\u043E\u0493\u0430\u0440\u0493\u044B \u0436\u04D9\u043D\u0435 \u0442\u04E9\u043C\u0435\u043D\u0433\u0456 \u0448\u0435\u0442\u0442\u0435\u0440\u0456 \u2013 2,0 \u0441\u043C, \u0441\u043E\u043B \u0436\u0430\u049B \u0448\u0435\u0442\u0456 \u2013 3,0 \u0441\u043C, \u043E\u04A3 \u0436\u0430\u049B \u0448\u0435\u0442\u0456 \u2013 1 \u0441\u043C.","\u0422\u0430\u049B\u044B\u0440\u044B\u043F\u0442\u044B \u0431\u0435\u0437\u0435\u043D\u0434\u0456\u0440\u0443: \u0422\u0430\u049B\u044B\u0440\u044B\u043F\u0442\u044B \u0431\u0430\u0441 \u04D9\u0440\u0456\u043F\u0442\u0435\u0440\u043C\u0435\u043D, \u049B\u0430\u043B\u044B\u04A3 \u0448\u0440\u0438\u0444\u043F\u0435\u043D, \u0436\u043E\u043B \u043E\u0440\u0442\u0430\u0441\u044B\u043D\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u043F \u0436\u0430\u0437\u0443 \u2013 \u041CA\u049A\u0410\u041B\u0410 \u0410\u0422\u0410\u0423\u042B; \u041A\u0435\u043B\u0435\u0441\u0456 \u0436\u043E\u043B\u0493\u0430 (\u049B\u0430\u043B\u044B\u04A3 \u043A\u0443\u0440\u0441\u0438\u0432 \u0448\u0440\u0438\u0444\u0442, \u043E\u04A3 \u0436\u0430\u049B\u049B\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u0443) \u2013 \u0442\u043E\u043B\u044B\u049B \u0430\u0442\u044B-\u0436\u04E9\u043D\u0456; \u041A\u0435\u043B\u0435\u0441\u0456 \u0436\u043E\u043B\u0493\u0430 (\u043A\u0443\u0440\u0441\u0438\u0432 \u0448\u0440\u0438\u0444\u0442, \u043E\u04A3 \u0436\u0430\u049B\u049B\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u0443) \u2013 \u0493\u044B\u043B\u044B\u043C\u0438 \u0430\u0442\u0430\u0493\u044B, \u0434\u04D9\u0440\u0435\u0436\u0435\u0441\u0456, \u043B\u0430\u0443\u0430\u0437\u044B\u043C\u044B, \u0436\u04B1\u043C\u044B\u0441 \u043E\u0440\u043D\u044B, \u049B\u0430\u043B\u0430; \u041A\u0435\u043B\u0435\u0441\u0456 \u0436\u043E\u043B\u0493\u0430 (\u043A\u0443\u0440\u0441\u0438\u0432 \u0448\u0440\u0438\u0444\u0442, \u043E\u04A3 \u0436\u0430\u049B\u049B\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u0443) \u2013 \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441 \u04AF\u0448\u0456\u043D \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u0434\u044B\u049B \u043F\u043E\u0448\u0442\u0430;1 \u0436\u043E\u043B \u0431\u043E\u0441 \u043E\u0440\u044B\u043D \u049B\u0430\u043B\u0434\u044B\u0440\u044B\u043F \u2013 \u043C\u0430\u049B\u0430\u043B\u0430 \u043C\u04D9\u0442\u0456\u043D\u0456. \u041C\u04D9\u0442\u0456\u043D\u0434\u0435 \u04D9\u0434\u0435\u0431\u0438\u0435\u0442 \u0442\u0456\u0437\u0456\u043C\u0456\u043D\u0434\u0435\u0433\u0456 \u0441\u04D9\u0439\u043A\u0435\u0441 \u0434\u0435\u0440\u0435\u043A\u043A\u04E9\u0437\u0433\u0435 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440\u0434\u0456 \u0430\u0440\u0430\u0431 \u0446\u0438\u0444\u0440\u043B\u0430\u0440\u044B\u043C\u0435\u043D \u0436\u04D9\u043D\u0435 \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0436\u0430\u049B\u0448\u0430\u043B\u0430\u0440\u0434\u0430 \u043A\u04E9\u0440\u0441\u0435\u0442\u0443 \u049B\u0430\u0436\u0435\u0442, \u043C\u044B\u0441\u0430\u043B\u044B: [1, \u0431. 277]. \u0411\u0435\u0442 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440\u0434\u0456 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0442\u044B \u0442\u04AF\u0440\u0434\u0435 \u049B\u043E\u043B\u0434\u0430\u043D\u0443\u0493\u0430 \u0431\u043E\u043B\u043C\u0430\u0439\u0434\u044B.","\u041C\u0430\u049B\u0430\u043B\u0430\u043D\u044B\u04A3 \u0441\u043E\u04A3\u044B\u043D\u0434\u0430 \u049B\u044B\u0441\u049B\u0430\u0448\u0430 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B (\u0440\u0435\u0437\u044E\u043C\u0435) \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456: \u043E\u0440\u044B\u0441 \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u043C\u0430\u049B\u0430\u043B\u0430 \u04AF\u0448\u0456\u043D \u2013 \u049B\u0430\u0437\u0430\u049B \u0436\u04D9\u043D\u0435 \u0430\u0493\u044B\u043B\u0448\u044B\u043D \u0442\u0456\u043B\u0434\u0435\u0440\u0456\u043D\u0434\u0435; \u049B\u0430\u0437\u0430\u049B \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u043C\u0430\u049B\u0430\u043B\u0430 \u04AF\u0448\u0456\u043D \u2013 \u043E\u0440\u044B\u0441 \u0436\u04D9\u043D\u0435 \u0430\u0493\u044B\u043B\u0448\u044B\u043D \u0442\u0456\u043B\u0434\u0435\u0440\u0456\u043D\u0434\u0435.","\u049A\u043E\u043B\u0436\u0430\u0437\u0431\u0430\u0493\u0430 \u0430\u0432\u0442\u043E\u0440 \u0442\u0443\u0440\u0430\u043B\u044B \u0430\u049B\u043F\u0430\u0440\u0430\u0442 \u049B\u043E\u0441\u0430 \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456: \u0442\u0435\u0433\u0456, \u0430\u0442\u044B, \u04D9\u043A\u0435\u0441\u0456\u043D\u0456\u04A3 \u0430\u0442\u044B, \u0493\u044B\u043B\u044B\u043C\u0438 \u0434\u04D9\u0440\u0435\u0436\u0435\u0441\u0456, \u0430\u0442\u0430\u0493\u044B, \u0436\u04B1\u043C\u044B\u0441 \u043E\u0440\u043D\u044B \u043C\u0435\u043D \u043B\u0430\u0443\u0430\u0437\u044B\u043C\u044B, \u049B\u0430\u043B\u0430\u0441\u044B, \u0435\u043B\u0456\u043D, \u0441\u043E\u043D\u0434\u0430\u0439-\u0430\u049B \u043F\u043E\u0448\u0442\u0430 \u0436\u04D9\u043D\u0435 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u0434\u044B\u049B \u043C\u0435\u043A\u0435\u043D\u0436\u0430\u0439\u044B, \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0434\u0430\u0440\u044B \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043B\u0443\u0456 \u049B\u0430\u0436\u0435\u0442.","\u04B0\u0441\u044B\u043D\u044B\u043B\u0493\u0430\u043D \u043C\u04D9\u0442\u0456\u043D\u0434\u0456 \u043E\u0440\u0444\u043E\u0433\u0440\u0430\u0444\u0438\u044F\u043B\u044B\u049B, \u0442\u044B\u043D\u044B\u0441 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456 \u0436\u04D9\u043D\u0435 \u0441\u0442\u0438\u043B\u044C\u0434\u0456\u043A \u049B\u0430\u0442\u0435\u043B\u0435\u0440 \u0442\u04B1\u0440\u0493\u044B\u0441\u044B\u043D\u0430\u043D \u0434\u04B1\u0440\u044B\u0441 \u04E9\u04A3\u0434\u0435\u0443\u0434\u0456 \u0441\u04B1\u0440\u0430\u0439\u043C\u044B\u0437.","\u04B0\u0439\u044B\u043C\u0434\u0430\u0441\u0442\u044B\u0440\u0443 \u043A\u043E\u043C\u0438\u0442\u0435\u0442\u0456 \u043C\u0430\u049B\u0430\u043B\u0430\u043B\u0430\u0440\u0434\u044B \u0436\u0430\u0440\u0438\u044F\u043B\u0430\u043D\u0493\u0430\u043D \u0442\u0430\u049B\u044B\u0440\u044B\u043F\u0442\u0430\u0440\u0493\u0430 \u0436\u04D9\u043D\u0435 \u0431\u0435\u0437\u0435\u043D\u0434\u0456\u0440\u0443 \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440\u044B\u043D\u0430 \u0441\u04D9\u0439\u043A\u0435\u0441 \u0456\u0440\u0456\u043A\u0442\u0435\u0443 \u049B\u04B1\u049B\u044B\u0493\u044B\u043D \u04E9\u0437 \u0436\u0430\u0443\u0430\u043F\u043A\u0435\u0440\u0448\u0456\u043B\u0456\u0433\u0456\u043D\u0435 \u0430\u043B\u0430\u0434\u044B."],fee:["\u049A\u0430\u0442\u044B\u0441\u0443 \u0436\u04D9\u043D\u0435 \u043C\u0430\u049B\u0430\u043B\u0430 \u04B1\u0441\u044B\u043D\u0443 \u0436\u0430\u0440\u043D\u0430\u0441\u044B 3000 \u0442\u0435\u04A3\u0433\u0435 (KZT).","\u0422\u0456\u0440\u043A\u0435\u043B\u0443 \u0436\u0430\u0440\u043D\u0430\u0441\u044B\u043D\u0430 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F\u0493\u0430 \u049B\u0430\u0442\u044B\u0441\u0443, \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F\u043B\u044B\u049B \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0434\u0430\u0440 \u043A\u0456\u0440\u0435\u0434\u0456. \u0411\u0430\u0493\u0430\u0493\u0430 \u0436\u0430\u0442\u044B\u043D \u043E\u0440\u044B\u043D, \u043A\u04E9\u043B\u0456\u043A \u0448\u044B\u0493\u044B\u043D\u0434\u0430\u0440\u044B \u0436\u04D9\u043D\u0435 \u0431\u0456\u0440\u0433\u0435 \u043A\u0435\u043B\u0435\u0442\u0456\u043D \u0430\u0434\u0430\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u0442\u04E9\u043B\u0435\u043C\u0456 \u043A\u0456\u0440\u043C\u0435\u0439\u0434\u0456."]},ru:{invitation:["\u041F\u0440\u0438\u0433\u043B\u0430\u0448\u0430\u0435\u043C \u0432\u0441\u0435\u0445 \u0437\u0430\u0438\u043D\u0442\u0435\u0440\u0435\u0441\u043E\u0432\u0430\u043D\u043D\u044B\u0445 \u043B\u0438\u0446 \u043F\u0440\u0438\u043D\u044F\u0442\u044C \u0443\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 \u041C\u0435\u0436\u0434\u0443\u043D\u0430\u0440\u043E\u0434\u043D\u043E\u0439 \u043D\u0430\u0443\u0447\u043D\u043E-\u043F\u0440\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438 \xAB\u041F\u0435\u0440\u0441\u043F\u0435\u043A\u0442\u0438\u0432\u043D\u044B\u0435 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u044F \u0430\u043A\u0442\u0443\u0430\u043B\u044C\u043D\u044B\u0445 \u043F\u0440\u043E\u0431\u043B\u0435\u043C \u0441\u043E\u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E\u0433\u043E \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F\xBB, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u0441\u043E\u0441\u0442\u043E\u0438\u0442\u0441\u044F 30\u201331 \u043E\u043A\u0442\u044F\u0431\u0440\u044F 2026 \u0433\u043E\u0434\u0430 \u0438 \u0431\u0443\u0434\u0435\u0442 \u043F\u043E\u0441\u0432\u044F\u0449\u0435\u043D\u0430 80-\u043B\u0435\u0442\u043D\u0435\u043C\u0443 \u044E\u0431\u0438\u043B\u0435\u044E \u0434\u043E\u043A\u0442\u043E\u0440\u0430 \u043F\u0435\u0434\u0430\u0433\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043D\u0430\u0443\u043A, \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u043E\u0440\u0430-\u0430\u043A\u0430\u0434\u0435\u043C\u0438\u043A\u0430, \u0434\u0432\u0443\u043A\u0440\u0430\u0442\u043D\u043E\u0433\u043E \u043E\u0431\u043B\u0430\u0434\u0430\u0442\u0435\u043B\u044F \u0437\u0432\u0430\u043D\u0438\u044F \xAB\u041B\u0443\u0447\u0448\u0438\u0439 \u043F\u0440\u0435\u043F\u043E\u0434\u0430\u0432\u0430\u0442\u0435\u043B\u044C \u0432\u044B\u0441\u0448\u0435\u0433\u043E \u0443\u0447\u0435\u0431\u043D\u043E\u0433\u043E \u0437\u0430\u0432\u0435\u0434\u0435\u043D\u0438\u044F\xBB, \u043F\u043E\u0447\u0435\u0442\u043D\u043E\u0433\u043E \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0438\u043D\u0430 \u041F\u0430\u043D\u0444\u0438\u043B\u043E\u0432\u0441\u043A\u043E\u0433\u043E \u0440\u0430\u0439\u043E\u043D\u0430, \u043A\u0430\u0432\u0430\u043B\u0435\u0440\u0430 \u043E\u0440\u0434\u0435\u043D\u0430 \xAB\u049A\u04B1\u0440\u043C\u0435\u0442\xBB, \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0433\u043E \u0447\u043B\u0435\u043D\u0430 \u0410\u043A\u0430\u0434\u0435\u043C\u0438\u0438 \u043F\u0435\u0434\u0430\u0433\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043D\u0430\u0443\u043A \u0420\u0435\u0441\u043F\u0443\u0431\u043B\u0438\u043A\u0438 \u041A\u0430\u0437\u0430\u0445\u0441\u0442\u0430\u043D - \u0430\u043A\u0430\u0434\u0435\u043C\u0438\u043A\u0430 \u0416\u0443\u043C\u0430\u0434\u0438\u043B\u0430 \u0411\u0430\u0439\u0434\u0438\u043B\u0434\u0430\u0435\u0432\u0438\u0447\u0430 \u0427\u0438\u043B\u0434\u0438\u0431\u0430\u0435\u0432\u0430."],bio:["\u0416\u0443\u043C\u0430\u0434\u0438\u043B \u0411\u0430\u0439\u0434\u0438\u043B\u0434\u0430\u0435\u0432\u0438\u0447 \u0427\u0438\u043B\u0434\u0438\u0431\u0430\u0435\u0432 - \u0434\u043E\u043A\u0442\u043E\u0440 \u043F\u0435\u0434\u0430\u0433\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043D\u0430\u0443\u043A, \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u043E\u0440, \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0447\u043B\u0435\u043D \u0410\u043A\u0430\u0434\u0435\u043C\u0438\u0438 \u043F\u0435\u0434\u0430\u0433\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043D\u0430\u0443\u043A \u0420\u0435\u0441\u043F\u0443\u0431\u043B\u0438\u043A\u0438 \u041A\u0430\u0437\u0430\u0445\u0441\u0442\u0430\u043D - \u0430\u043A\u0430\u0434\u0435\u043C\u0438\u043A, \u0443\u0447\u0435\u043D\u044B\u0439, \u0432\u043D\u0435\u0441\u0448\u0438\u0439 \u0437\u043D\u0430\u0447\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0432\u043A\u043B\u0430\u0434 \u0432 \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u0435 \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u0438, \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u0438 \u0438 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u043D\u0430\u0443\u043A, \u0444\u043E\u0440\u043C\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043D\u0430\u0443\u0447\u043D\u043E-\u043C\u0435\u0442\u043E\u0434\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u0431\u0430\u0437\u044B, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u0435 \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F. \u0418\u043C \u043E\u043F\u0443\u0431\u043B\u0438\u043A\u043E\u0432\u0430\u043D\u043E \u0431\u043E\u043B\u0435\u0435 400 \u043D\u0430\u0443\u0447\u043D\u044B\u0445 \u0438 \u043D\u0430\u0443\u0447\u043D\u043E-\u043C\u0435\u0442\u043E\u0434\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u0441\u0442\u0430\u0442\u0435\u0439 \u0432 \u043C\u0435\u0436\u0434\u0443\u043D\u0430\u0440\u043E\u0434\u043D\u044B\u0445, \u0437\u0430\u0440\u0443\u0431\u0435\u0436\u043D\u044B\u0445 \u0438 \u0440\u0435\u0441\u043F\u0443\u0431\u043B\u0438\u043A\u0430\u043D\u0441\u043A\u0438\u0445 \u0438\u0437\u0434\u0430\u043D\u0438\u044F\u0445, 79 \u0443\u0447\u0435\u0431\u043D\u0438\u043A\u043E\u0432 \u0438 \u0443\u0447\u0435\u0431\u043D\u043E-\u043C\u0435\u0442\u043E\u0434\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u0442\u0440\u0443\u0434\u043E\u0432, 49 \u0442\u0438\u043F\u043E\u0432\u044B\u0445 \u0443\u0447\u0435\u0431\u043D\u044B\u0445 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u043C, 46 \u043D\u0430\u0443\u0447\u043D\u044B\u0445 \u0434\u043E\u043A\u043B\u0430\u0434\u043E\u0432, \u0430 \u0442\u0430\u043A \u0436\u0435 \u0443\u0447\u0435\u043D\u044B\u0439 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u043E\u0431\u043B\u0430\u0434\u0430\u0442\u0435\u043B\u0435\u043C 19 \u0430\u0432\u0442\u043E\u0440\u0441\u043A\u0438\u0445 \u0441\u0432\u0438\u0434\u0435\u0442\u0435\u043B\u044C\u0441\u0442\u0432. \u0415\u0433\u043E \u043F\u0440\u043E\u0444\u0435\u0441\u0441\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u0430\u044F \u0434\u0435\u044F\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u044C \u043E\u0445\u0432\u0430\u0442\u044B\u0432\u0430\u0435\u0442 \u0431\u043E\u043B\u0435\u0435 60 \u043B\u0435\u0442 \u0438 \u0432 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0435 \u0432\u0440\u0435\u043C\u044F \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u0435\u0442\u0441\u044F \u0432 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F\u0445 \u043F\u043E\u0434\u0433\u043E\u0442\u043E\u0432\u043A\u0438 \u043D\u0430\u0443\u0447\u043D\u044B\u0445 \u043A\u0430\u0434\u0440\u043E\u0432, \u043D\u0430\u0443\u0447\u043D\u043E\u0433\u043E \u0440\u0443\u043A\u043E\u0432\u043E\u0434\u0441\u0442\u0432\u0430 \u043C\u043E\u043B\u043E\u0434\u044B\u043C\u0438 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u0435\u043B\u044F\u043C\u0438 \u0438 \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u044F \u043E\u0442\u0435\u0447\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0433\u043E \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u0438 \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F. \u041D\u0430 \u0441\u0435\u0433\u043E\u0434\u043D\u044F\u0448\u043D\u0438\u0439 \u0434\u0435\u043D\u044C \u043F\u043E\u0434 \u0440\u0443\u043A\u043E\u0432\u043E\u0434\u0441\u0442\u0432\u043E\u043C \u0416\u0443\u043C\u0430\u0434\u0438\u043B\u0430 \u0411\u0430\u0439\u0434\u0438\u043B\u0434\u0430\u0435\u0432\u0438\u0447\u0430 \u0443\u0441\u043F\u0435\u0448\u043D\u043E \u0437\u0430\u0449\u0438\u0442\u0438\u043B\u0438 4 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u0430 \u043D\u0430\u0443\u043A \u0438 17 \u0434\u043E\u043A\u0442\u043E\u0440\u043E\u0432 \u0444\u0438\u043B\u043E\u0441\u043E\u0444\u0438\u0438 (PhD)."],about:["\u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F \u0441\u0442\u0430\u043D\u0435\u0442 \u043C\u0435\u0436\u0434\u0443\u043D\u0430\u0440\u043E\u0434\u043D\u043E\u0439 \u043D\u0430\u0443\u0447\u043D\u043E\u0439 \u043F\u043B\u043E\u0449\u0430\u0434\u043A\u043E\u0439 \u0434\u043B\u044F \u043E\u0431\u043C\u0435\u043D\u0430 \u0438\u0434\u0435\u044F\u043C\u0438, \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u0430\u043C\u0438 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u0439 \u0438 \u043F\u0440\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u043C \u043E\u043F\u044B\u0442\u043E\u043C \u0432 \u043E\u0431\u043B\u0430\u0441\u0442\u0438 \u0443\u0441\u0442\u043E\u0439\u0447\u0438\u0432\u043E\u0433\u043E \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u044F, \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F, \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0438 \u043E\u0445\u0440\u0430\u043D\u044B \u0431\u0438\u043E\u0440\u0430\u0437\u043D\u043E\u043E\u0431\u0440\u0430\u0437\u0438\u044F, \u0441\u043E\u0432\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u043D\u0430\u0443\u0447\u043D\u044B\u0445 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u0439 \u0438 \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439. \u041C\u0435\u0440\u043E\u043F\u0440\u0438\u044F\u0442\u0438\u0435 \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u0438\u0442 \u0432\u0435\u0434\u0443\u0449\u0438\u0445 \u0443\u0447\u0435\u043D\u044B\u0445 \u041A\u0430\u0437\u0430\u0445\u0441\u0442\u0430\u043D\u0430 \u0438 \u0437\u0430\u0440\u0443\u0431\u0435\u0436\u043D\u044B\u0445 \u0441\u0442\u0440\u0430\u043D, \u043F\u0440\u0435\u043F\u043E\u0434\u0430\u0432\u0430\u0442\u0435\u043B\u0435\u0439, \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u0435\u043B\u0435\u0439, \u0434\u043E\u043A\u0442\u043E\u0440\u0430\u043D\u0442\u043E\u0432 \u0438 \u043C\u043E\u043B\u043E\u0434\u044B\u0445 \u0443\u0447\u0435\u043D\u044B\u0445 \u0438 \u0431\u0443\u0434\u0435\u0442 \u0441\u043F\u043E\u0441\u043E\u0431\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u0443\u043A\u0440\u0435\u043F\u043B\u0435\u043D\u0438\u044E \u043C\u0435\u0436\u0434\u0443\u043D\u0430\u0440\u043E\u0434\u043D\u043E\u0433\u043E \u043D\u0430\u0443\u0447\u043D\u043E\u0433\u043E \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u0447\u0435\u0441\u0442\u0432\u0430 \u0432 \u043E\u0431\u043B\u0430\u0441\u0442\u0438 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u043D\u0430\u0443\u043A \u0438 \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F, \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u044E \u043C\u0435\u0436\u0434\u0438\u0441\u0446\u0438\u043F\u043B\u0438\u043D\u0430\u0440\u043D\u044B\u0445 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u0439, \u0430 \u0442\u0430\u043A\u0436\u0435 \u043E\u0431\u043C\u0435\u043D\u0443 \u043D\u0430\u0443\u0447\u043D\u044B\u043C \u0438 \u043F\u0435\u0434\u0430\u0433\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438\u043C \u043E\u043F\u044B\u0442\u043E\u043C.","\u0426\u0435\u043B\u044C \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438: \u041D\u0430\u0443\u0447\u043D\u043E-\u0442\u0435\u043E\u0440\u0435\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u0438 \u043F\u0440\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043E\u0431\u0441\u0443\u0436\u0434\u0435\u043D\u0438\u0435 \u0430\u043A\u0442\u0443\u0430\u043B\u044C\u043D\u044B\u0445 \u043F\u0440\u043E\u0431\u043B\u0435\u043C \u0441\u043E\u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E\u0433\u043E \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F; \u043E\u0431\u043C\u0435\u043D \u0440\u0435\u0437\u0443\u043B\u044C\u0442\u0430\u0442\u0430\u043C\u0438 \u0441\u043E\u0432\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u0438\u0441\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u043D\u0438\u0439 \u0438 \u043F\u0435\u0440\u0435\u0434\u043E\u0432\u044B\u043C \u043E\u043F\u044B\u0442\u043E\u043C \u0432 \u043E\u0431\u043B\u0430\u0441\u0442\u0438 \u0431\u0438\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u043D\u0430\u0443\u043A\u0438 \u0438 \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F; \u043E\u043F\u0440\u0435\u0434\u0435\u043B\u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0441\u043F\u0435\u043A\u0442\u0438\u0432\u043D\u044B\u0445 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0439 \u0441\u043E\u0432\u0435\u0440\u0448\u0435\u043D\u0441\u0442\u0432\u043E\u0432\u0430\u043D\u0438\u044F \u0438\u043D\u043D\u043E\u0432\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439. \u041E\u0441\u043E\u0431\u043E\u0435 \u0432\u043D\u0438\u043C\u0430\u043D\u0438\u0435 \u043F\u0440\u0435\u0434\u043F\u043E\u043B\u0430\u0433\u0430\u0435\u0442\u0441\u044F \u0443\u0434\u0435\u043B\u0438\u0442\u044C \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C \u044D\u043A\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F, \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F \u0431\u0438\u043E\u0440\u0430\u0437\u043D\u043E\u043E\u0431\u0440\u0430\u0437\u0438\u044F, \u0443\u0441\u0442\u043E\u0439\u0447\u0438\u0432\u043E\u0433\u043E \u0440\u0430\u0437\u0432\u0438\u0442\u0438\u044F, \u0432\u043D\u0435\u0434\u0440\u0435\u043D\u0438\u044F \u0446\u0438\u0444\u0440\u043E\u0432\u044B\u0445 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0439 \u0432 \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u043F\u0440\u043E\u0446\u0435\u0441\u0441, \u0443\u043A\u0440\u0435\u043F\u043B\u0435\u043D\u0438\u044F \u043D\u0430\u0443\u0447\u043D\u043E\u0433\u043E \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u0447\u0435\u0441\u0442\u0432\u0430 \u043C\u0435\u0436\u0434\u0443 \u043E\u0442\u0435\u0447\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u043C\u0438 \u0438 \u0437\u0430\u0440\u0443\u0431\u0435\u0436\u043D\u044B\u043C\u0438 \u 444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u044E."],requirements:["\u041F\u0440\u0438 \u043F\u043E\u0434\u0433\u043E\u0442\u043E\u0432\u043A\u0435 \u0441\u0442\u0430\u0442\u044C\u0438 \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u0441\u043E\u0431\u043B\u044E\u0434\u0430\u0442\u044C \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0435 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F: \u043E\u0431\u044A\u0435\u043C \u0442\u0435\u043A\u0441\u0442\u0430 - \u043D\u0435 \u0431\u043E\u043B\u0435\u0435 10 \u0441\u0442\u0440\u0430\u043D\u0438\u0446, \u0448\u0440\u0438\u0444\u0442 - Times New Roman, \u0440\u0430\u0437\u043C\u0435\u0440 \u0448\u0440\u0438\u0444\u0442\u0430 - 14 pt, \u043C\u0435\u0436\u0441\u0442\u0440\u043E\u0447\u043D\u044B\u0439 \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B - 1,0, \u0432\u044B\u0440\u0430\u0432\u043D\u0438\u0432\u0430\u043D\u0438\u0435 \u043E\u0441\u043D\u043E\u0432\u043D\u043E\u0433\u043E \u0442\u0435\u043A\u0441\u0442\u0430 - \u043F\u043E \u0448\u0438\u0440\u0438\u043D\u0435, \u0430\u0431\u0437\u0430\u0446\u043D\u044B\u0439 \u043E\u0442\u0441\u0442\u0443\u043F - 1 \u0441\u043C, \u043E\u0440\u0438\u0435\u043D\u0442\u0430\u0446\u0438\u044F \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u044B - \u043A\u043D\u0438\u0436\u043D\u0430\u044F, \u0432\u0435\u0440\u0445\u043D\u0435\u0435 \u0438 \u043D\u0438\u0436\u043D\u0435\u0435 \u043F\u043E\u043B\u044F - 2,0 \u0441\u043C, \u043B\u0435\u0432\u043E\u0435 \u043F\u043E\u043B\u0435 - 3,0 \u0441\u043C, \u043F\u0440\u0430\u0432\u043E\u0435 \u043F\u043E\u043B\u0435 - 1,0 \u0441\u043C.","\u041E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u0435 \u0437\u0430\u0433\u043E\u043B\u043E\u0432\u043E\u0447\u043D\u043E\u0439 \u0447\u0430\u0441\u0442\u0438 \u0441\u0442\u0430\u0442\u044C\u0438: \u041D\u0410\u0417\u0412\u0410\u041D\u0418\u0415 \u0421\u0422\u0410\u0422\u042C\u0418 - \u043F\u0440\u043E\u043F\u0438\u0441\u043D\u044B\u043C\u0438 \u0431\u0443\u043A\u0432\u0430\u043C\u0438, \u043F\u043E\u043B\u0443\u0436\u0438\u0440\u043D\u044B\u043C \u0448\u0440\u0438\u0444\u0442\u043E\u043C, \u0432\u044B\u0440\u0430\u0432\u043D\u0438\u0432\u0430\u043D\u0438\u0435 \u043F\u043E \u0446\u0435\u043D\u0442\u0440\u0443. \u041D\u0430 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0435\u0439 \u0441\u0442\u0440\u043E\u043A\u0435 - \u0444\u0430\u043C\u0438\u043B\u0438\u044F, \u0438\u043C\u044F, \u043E\u0442\u0447\u0435\u0441\u0442\u0432\u043E \u0430\u0432\u0442\u043E\u0440\u0430 \u043F\u043E\u043B\u043D\u043E\u0441\u0442\u044C\u044E, \u043F\u043E\u043B\u0443\u0436\u0438\u0440\u043D\u044B\u043C \u043A\u0443\u0440\u0441\u0438\u0432\u043E\u043C, \u0432\u044B\u0440\u0430\u0432\u043D\u0438\u0432\u0430\u043D\u0438\u0435 \u043F\u043E \u043F\u0440\u0430\u0432\u043E\u043C\u0443 \u043A\u0440\u0430\u044E. \u041D\u0430 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0435\u0439 \u0441\u0442\u0440\u043E\u043A\u0435 - \u0443\u0447\u0435\u043D\u0430\u044F \u0441\u0442\u0435\u043F\u0435\u043D\u044C, \u0443\u0447\u0435\u043D\u043E\u0435 \u0437\u0432\u0430\u043D\u0438\u0435, \u0434\u043E\u043B\u0436\u043D\u043E\u0441\u0442\u044C, \u043C\u0435\u0441\u0442\u043E \u0440\u0430\u0431\u043E\u0442\u044B, \u0433\u043E\u0440\u043E\u0434, \u043A\u0443\u0440\u0441\u0438\u0432\u043E\u043C, \u0432\u044B\u0440\u0430\u0432\u043D\u0438\u0432\u0430\u043D\u0438\u0435 \u043F\u043E \u043F\u0440\u0430\u0432\u043E\u043C\u0443 \u043A\u0440\u0430\u044E. \u041D\u0430 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0435\u0439 \u0441\u0442\u0440\u043E\u043A\u0435 - \u0430\u0434\u0440\u0435\u0441 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u0439 \u043F\u043E\u0447\u0442\u044B \u0434\u043B\u044F \u0441\u0432\u044F\u0437\u0438, \u043A\u0443\u0440\u0441\u0438\u0432\u043E\u043C, \u0432\u044B\u0440\u0430\u0432\u043D\u0438\u0432\u0430\u043D\u0438\u0435 \u043F\u043E \u043F\u0440\u0430\u0432\u043E\u043C\u0443 \u043A\u0440\u0430\u044E. \u041F\u043E\u0441\u043B\u0435 \u043E\u0434\u043D\u043E\u0439 \u043F\u0443\u0441\u0442\u043E\u0439 \u0441\u0442\u0440\u043E\u043A\u0438 \u0440\u0430\u0437\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F \u043E\u0441\u043D\u043E\u0432\u043D\u043E\u0439 \u0442\u0435\u043A\u0441\u0442 \u0441\u0442\u0430\u0442\u044C\u0438. \u0421\u0441\u044B\u043B\u043A\u0438 \u043D\u0430 \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u0438 \u0438\u0437 \u0441\u043F\u0438\u0441\u043A\u0430 \u043B\u0438\u0442\u0435\u0440\u0430\u0442\u0443\u0440\u044B \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u0443\u043A\u0430\u0437\u044B\u0432\u0430\u0442\u044C \u0432 \u0442\u0435\u043A\u0441\u0442\u0435 \u0430\u0440\u0430\u0431\u0441\u043A\u0438\u043C\u0438 \u0446\u0438\u0444\u0440\u0430\u043C\u0438 \u0432 \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u043D\u044B\u0445 \u0441\u043A\u043E\u0431\u043A\u0430\u0445, \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440: [1, \u0441. 277]. \u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u0435 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043F\u043E\u0441\u0442\u0440\u0430\u043D\u0438\u0447\u043D\u044B\u0445 \u0441\u043D\u043E\u0441\u043E\u043A \u043D\u0435 \u0434\u043E\u043F\u0443\u0441\u043A\u0430\u0435\u0442\u0441\u044F.","\u0412 \u043A\u043E\u043D\u0446\u0435 \u0441\u0442\u0430\u0442\u044C\u0438 \u0440\u0430\u0437\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F \u043A\u0440\u0430\u0442\u043A\u043E\u0435 \u0440\u0435\u0437\u044E\u043C\u0435: \u0434\u043B\u044F \u0441\u0442\u0430\u0442\u044C\u0438 \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0435 - \u043D\u0430 \u043A\u0430\u0437\u0430\u0445\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0430\u0445; \u0434\u043B\u044F \u0441\u0442\u0430\u0442\u044C\u0438 \u043D\u0430 \u043A\u0430\u0437\u0430\u0445\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0435 - \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0430\u0445.","\u041A \u0440\u0443\u043A\u043E\u043F\u0438\u0441\u0438 \u043D\u0435\u043E\u0431\u0445\u043E\u0434\u0438\u043C\u043E \u043F\u0440\u0438\u043B\u043E\u0436\u0438\u0442\u044C \u0441\u0432\u0435\u0434\u0435\u043D\u0438\u044F \u043E\u0431 \u0430\u0432\u0442\u043E\u0440\u0435: \u0444\u0430\u043C\u0438\u043B\u0438\u044F, \u0438\u043C\u044F, \u043E\u0442\u0447\u0435\u0441\u0442\u0432\u043E, \u0443\u0447\u0435\u043D\u0430\u044F \u0441\u0442\u0435\u043F\u0435\u043D\u044C, \u0443\u0447\u0435\u043D\u043E\u0435 \u0437\u0432\u0430\u043D\u0438\u0435, \u043C\u0435\u0441\u0442\u043E \u0440\u0430\u0431\u043E\u0442\u044B \u0438 \u0434\u043E\u043B\u0436\u043D\u043E\u0441\u0442\u044C, \u0433\u043E\u0440\u043E\u0434, \u0441\u0442\u0440\u0430\u043D\u0430, \u043F\u043E\u0447\u0442\u043E\u0432\u044B\u0439 \u0438 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u044B\u0439 \u0430\u0434\u0440\u0435\u0441\u0430, \u043A\u043E\u043D\u0442\u0430\u043A\u0442\u043D\u044B\u0439 \u0442\u0435\u043B\u0435\u0444\u043E\u043D.","\u0410\u0432\u0442\u043E\u0440\u0430\u043C \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0443\u0435\u0442\u0441\u044F \u0442\u0449\u0430\u0442\u0435\u043B\u044C\u043D\u043E \u043F\u0440\u043E\u0432\u0435\u0440\u0438\u0442\u044C \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u043C\u044B\u0439 \u0442\u0435\u043A\u0441\u0442 \u043D\u0430 \u043D\u0430\u043B\u0438\u0447\u0438\u0435 \u043E\u0440\u0444\u043E\u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0438\u0445, \u043F\u0443\u043D\u043A\u0442\u0443\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u0438 \u0441\u0442\u0438\u043B\u0438\u0441\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043E\u0448\u0438\u0431\u043E\u043A.","\u041E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0439 \u043A\u043E\u043C\u0438\u0442\u0435\u0442 \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 \u0437\u0430 \u0441\u043E\u0431\u043E\u0439 \u043F\u0440\u0430\u0432\u043E \u043E\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043B\u044F\u0442\u044C \u043E\u0442\u0431\u043E\u0440 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u043E\u0432 \u0432 \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0442\u0435\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u043C\u0438 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F\u043C\u0438 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438 \u0438 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D\u043D\u044B\u043C\u0438 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F\u043C\u0438 \u043A \u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u044E."],fee:["\u0420\u0430\u0437\u043C\u0435\u0440 \u0432\u0437\u043D\u043E\u0441\u0430 \u0437\u0430 \u0443\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438 \u0438 \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0441\u0442\u0430\u0442\u044C\u0438 \u0441\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 3000 \u0442\u0435\u043D\u0433\u0435 (KZT). \u041E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441 \u0432\u043A\u043B\u044E\u0447\u0430\u0435\u0442 \u0443\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438 \u0438 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u0435 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u043E\u0432 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438. \u0420\u0430\u0441\u0445\u043E\u0434\u044B \u043D\u0430 \u043F\u0440\u043E\u0436\u0438\u0432\u0430\u043D\u0438\u0435, \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0440\u0430\u0441\u0445\u043E\u0434\u044B \u0441\u043E\u043F\u0440\u043E\u0432\u043E\u0436\u0434\u0430\u044E\u0449\u0438\u0445 \u043B\u0438\u0446 \u0432 \u0441\u0443\u043C\u043C\u0443 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u043E\u043D\u043D\u043E\u0433\u043E \u0432\u0437\u043D\u043E\u0441\u0430 \u043D\u0435 \u0432\u0445\u043E\u0434\u044F\u0442."]},en:{invitation:['On October 30-31, 2026, we invite all interested persons to the International Scientific and Practical Conference "PERSPECTIVE DIRECTIONS FOR THE STUDY OF MODERN BIOLOGICAL EDUCATION" dedicated to the 80th anniversary of Doctor of Pedagogical Sciences, Professor-Academician, 2-time holder of the title "The Best Teacher of Higher Education", Honorary Citizen of Panfilov District, Holder of the Order "Kurmet", full member of the Academy of Educational Sciences of the Republic of Kazakhstan - Academician Zhumadil Baidildauly Childibayev!'],bio:["Zhumadil Childibayev \u2013 Doctor of Pedagogical Sciences, Professor, full member of the Academy of Pedagogical Sciences of the Republic of Kazakhstan \u2013 academician, scientist who has been engaged in large-scale scientific and pedagogical activities in the field of development of biology, ecology and natural sciences, formation of scientific and methodological base, environmental education. He has published more than 400 scientific and methodological articles in international, CIS and republican publications. 79 textbooks and educational and methodological works, 49 standard curricula, 46 scientific reports have been published, 19 certificates of authorship have been published. The professional career of the scientist spanned 60 years, and today he continues to work in the field of training scientific personnel, supervising young researchers and developing domestic biological and ecological education. To date, 4 Candidates of Science and 17 Doctors of Philosophy (PhD) have successfully defended their theses under the supervision of Zhumadil Baidildauly."],about:["The conference will be an international platform for the exchange of scientific ideas and experience in the fields of sustainable development, environmental education, conservation and protection of biodiversity, scientific research and modern areas of education. This conference will bring together leading scientists, teachers, researchers, doctoral students and young scientists from Kazakhstan and abroad, contribute to the strengthening of international scientific cooperation in the field of natural sciences and education, the development of interdisciplinary research and the exchange of scientific and pedagogical experience.","The purpose of the conference: Discussion of topical issues of modern biological education from a scientific, theoretical and practical point of view, exchange of the results and best practices of modern research in the field of biological science and education, identification of promising directions for the improvement of innovative educational technologies. At the same time, scientific exchange of scientific opinions on the issues of environmental education, conservation of biodiversity, sustainable development, introduction of digital technologies into the educational process, strengthening of scientific cooperation of domestic and foreign scientists and teachers and development of scientific potential of young researchers.","Participants. The conference is open to domestic and foreign scientists, teachers, researchers, doctoral students, undergraduates and young scientists, as well as administrative staff of educational organizations who conduct research in the fields of biology and natural sciences, environmental education, biodiversity conservation and protection, scientific research and digital technologies."],registration:["The procedure for registration for the conference, information on sending congratulations and memorial letters dedicated to the anniversary of Doctor of Sciences, Professor-Academician Zh.B. Childibayev, as well as other detailed information are indicated on the official website of the event (or Appendix 1). Participants must fill out the registration form by October 20, 2026 and send it to the organizing committee. Registration and publication fees of participants are paid after receiving a letter of notification of their participation."],format:["Work format: hybrid (offline - online). The program includes plenary speeches of invited speakers, parallel thematic sections."],publication:["Following the results of the conference, a collection of reports and reports will be prepared and published in electronic format.","The Organizing Committee shall take responsibility for the selection of articles in accordance with the published topics and decoration requirements."],requirements:["When preparing articles, it is necessary to comply with the following requirements: the volume of text typed in electronic version should not exceed 10 pages. Font \u2013 Times New Roman, font size \u2013 14; line spacing \u2013 1; alignment of text to width; paragraph indentation \u2013 1 cm; page direction \u2013 portrait, upper and lower edges \u2013 2.0 cm, left edge \u2013 3.0 cm, right edge \u2013 1 cm.","Decoration of the heading: Write the title in capital letters, bold font, aligned in the middle of the line \u2013 ARTICLE TITLE; The next line (bold italics, alignment to the right) \u2013 full name; To the next line (italics font, alignment to the right) \u2013 scientific title, degree, position, place of work, city; To the next line (italics font, alignment to the right) \u2013 e-mail for communication; 1 line leaving space \u2013 the text of the article. In the text, it is necessary to indicate references to the corresponding source in the list of references in Arabic numerals and square brackets, for example: [1, p. 277]. Links to the page cannot be used automatically.","At the end of the article, a brief summary (summary) is given: for an article in Russian \u2013 in Kazakh and English; for an article in Kazakh \u2013 in Russian and English.","The manuscript must include information about the author: surname, first name, patronymic, scientific degree, title, place of work and position, city, country, as well as postal and e-mail addresses, contact phone numbers.","We ask you to correctly edit the proposed text in terms of spelling, punctuation marks and stylistic errors.","The Organizing Committee shall take responsibility for the selection of articles in accordance with the published topics and decoration requirements."],fee:["The fee for participation and submission of the article is 3000 tenge (KZT).","The registration fee includes participation in the conference, conference materials. The price does not include accommodation, transportation costs and accompanying persons."]}};var sg={"\xAB\u049A\u0410\u0417\u0406\u0420\u0413\u0406 \u0411\u0418\u041E\u041B\u041E\u0413\u0418\u042F\u041B\u042B\u049A \u0411\u0406\u041B\u0406\u041C \u0411\u0415\u0420\u0423 \u041C\u04D8\u0421\u0415\u041B\u0415\u041B\u0415\u0420\u0406\u041D \u0417\u0415\u0420\u0422\u0422\u0415\u0423\u0414\u0406\u04A2 \u041F\u0415\u0420\u0421\u041F\u0415\u041A\u0422\u0418\u0412\u0410\u041B\u042B\u049A \u0411\u0410\u0492\u042B\u0422\u0422\u0410\u0420\u042B\xBB":["\xAB\u041F\u0415\u0420\u0421\u041F\u0415\u041A\u0422\u0418\u0412\u041D\u042B\u0415 \u041D\u0410\u041F\u0420\u0410\u0412\u041B\u0415\u041D\u0418\u042F \u0418\u0421\u0421\u041B\u0415\u0414\u041E\u0412\u0410\u041D\u0418\u042F \u0410\u041A\u0422\u0423\u0410\u041B\u042C\u041D\u042B\u0425 \u041F\u0420\u041E\u0411\u041B\u0415\u041C \u0421\u041E\u0412\u0420\u0415\u041C\u0415\u041D\u041D\u041E\u0413\u041E \u0411\u0418\u041E\u041B\u041E\u0413\u0418\u0427\u0415\u0421\u041A\u041E\u0413\u041E \u041E\u0411\u0420\u0410\u0417\u041E\u0412\u0410\u041D\u0418\u042F\xBB","\u201CPERSPECTIVE DIRECTIONS OF RESEARCH IN MODERN BIOLOGICAL EDUCATION\u201D"],"\u0410\u043B\u043C\u0430\u0442\u044B \u0443\u0430\u049B\u044B\u0442\u044B \xB7 UTC+5":["\u0412\u0440\u0435\u043C\u044F ,"\u049A\u0410\u0422\u042B\u0421\u0423\u0428\u042B\u041B\u0410\u0420\u0492\u0410 \u0410\u049A\u041F\u0410\u0420\u0410\u0422":["\u0418\u041D\u0424\u041E\u0420\u041C\u0410\u0426\u0418\u042F \u0414\u041B\u042F \u0423\u0427\u0410\u0421\u0422\u041D\u0418\u041A\u041E\u0412","INFORMATION FOR PARTICIPANTS"],"\u0416\u0438\u0456 \u049B\u043E\u0439\u044B\u043B\u0430\u0442\u044B\u043D \u0441\u04B1\u0440\u0430\u049B\u0442\u0430\u0440":["\u0427\u0430\u0441\u0442\u043E \u0437\u0430\u0434\u0430\u0432\u0430\u0435\u043C\u044B\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B","Frequently asked questions"],"\u041C\u0430\u049B\u0430\u043B\u0430\u0493\u0430 \u049B\u0430\u043D\u0434\u0430\u0439 \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440 \u049B\u043E\u0439\u044B\u043B\u0430\u0434\u044B?":["\u041A\u0430\u043A\u043E\u0432\u044B \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F \u043A \u0441\u0442\u0430\u0442\u044C\u0435?","What are the paper requirements?"],"\u041A\u04E9\u043B\u0435\u043C\u0456 \u2014 10 \u0431\u0435\u0442\u0442\u0435\u043D \u0430\u0441\u043F\u0430\u0439\u0434\u044B. \u049A\u0430\u0440\u0456\u043F \u2014 Times New Roman, 14 \u043F\u0442; \u0436\u043E\u043B\u0430\u0440\u0430\u043B\u044B\u049B \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B \u2014 1; \u0430\u0431\u0437\u0430\u0446 \u0448\u0435\u0433\u0456\u043D\u0456\u0441\u0456 \u2014 1 \u0441\u043C. \u0411\u0435\u0442 \u0448\u0435\u0442\u0442\u0435\u0440\u0456: \u0436\u043E\u0493\u0430\u0440\u044B \u0436\u04D9\u043D\u0435 \u0442\u04E9\u043C\u0435\u043D \u2014 2 \u0441\u043C, \u0441\u043E\u043B \u0436\u0430\u049B \u2014 3 \u0441\u043C, \u043E\u04A3 \u0436\u0430\u049B \u2014 1 \u0441\u043C.":["\u041E\u0431\u044A\u0451\u043C \u2014 \u043D\u0435 \u0431\u043E\u043B\u0435\u0435 10 \u0441\u0442\u0440\u0430\u043D\u0438\u0446. \u0428\u0440\u0438\u0444\u0442 \u2014 Times New Roman, 14 \u043F\u0442; \u043C\u0435\u0436\u0441\u0442\u0440\u043E\u0447\u043D\u044B\u0439 \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B \u2014 1; \u0430\u0431\u0437\u0430\u0446\u043D\u044B\u0439 \u043E\u0442\u0441\u0442\u0443\u043F \u2014 1 \u0441\u043C. \u041F\u043E\u043B\u044F: \u0432\u0435\u0440\u0445\u043D\u0435\u0435 \u0438 \u043D\u0438\u0436\u043D\u0435\u0435 \u2014 2 \u0441\u043C, \u043B\u0435\u0432\u043E\u0435 \u2014 3 \u0441\u043C, \u043F\u0440\u0430\u0432\u043E\u0435 \u2014 1 \u0441\u043C.","Maximum length: 10 pages. Use Times New Roman, 14 pt, single spacing and a 1 cm paragraph indent. Margins: 2 cm top and bottom, 3 cm left and 1 cm right."],"\u041C\u0430\u049B\u0430\u043B\u0430 \u0442\u0430\u049B\u044B\u0440\u044B\u0431\u044B \u0431\u0430\u0441 \u04D9\u0440\u0456\u043F\u0442\u0435\u0440\u043C\u0435\u043D, \u049B\u0430\u043B\u044B\u04A3 \u049B\u0430\u0440\u0456\u043F\u043F\u0435\u043D \u043E\u0440\u0442\u0430\u0493\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u043D\u0430\u0434\u044B. \u0410\u0432\u0442\u043E\u0440\u0434\u044B\u04A3 \u0430\u0442\u044B-\u0436\u04E9\u043D\u0456, \u0493\u044B\u043B\u044B\u043C\u0438 \u0434\u04D9\u0440\u0435\u0436\u0435\u0441\u0456, \u043B\u0430\u0443\u0430\u0437\u044B\u043C\u044B, \u0436\u04B1\u043C\u044B\u0441 \u043E\u0440\u043D\u044B \u043C\u0435\u043D \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u0434\u044B\u049B \u043F\u043E\u0448\u0442\u0430\u0441\u044B \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043B\u0435\u0434\u0456. \u049A\u0430\u0437\u0430\u049B \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u043C\u0430\u049B\u0430\u043B\u0430\u0493\u0430 \u043E\u0440\u044B\u0441 \u0436\u04D9\u043D\u0435 \u0430\u0493\u044B\u043B\u0448\u044B\u043D \u0442\u0456\u043B\u0434\u0435\u0440\u0456\u043D\u0434\u0435, \u043E\u0440\u044B\u0441 \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u043C\u0430\u049B\u0430\u043B\u0430\u0493\u0430 \u049B\u0430\u0437\u0430\u049B \u0436\u04D9\u043D\u0435 \u0430\u0493\u044B\u043B\u0448\u044B\u043D \u0442\u0456\u043B\u0434\u0435\u0440\u0456\u043D\u0434\u0435 \u0440\u0435\u0437\u044E\u043C\u0435 \u049B\u043E\u0441\u044B\u043B\u0430\u0434\u044B.":["\u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u0441\u0442\u0430\u0442\u044C\u0438 \u043E\u0444\u043E\u0440\u043C\u043B\u044F\u0435\u0442\u0441\u044F \u043F\u0440\u043E\u043F\u0438\u0441\u043D\u044B\u043C\u0438 \u0431\u0443\u043A\u0432\u0430\u043C\u0438, \u043F\u043E\u043B\u0443\u0436\u0438\u0440\u043D\u044B\u043C \u0448\u0440\u0438\u0444\u0442\u043E\u043C, \u043F\u043E \u0446\u0435\u043D\u0442\u0440\u0443. \u0423\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0424\u0418\u041E \u0430\u0432\u0442\u043E\u0440\u0430, \u0443\u0447\u0451\u043D\u0430\u044F \u0441\u0442\u0435\u043F\u0435\u043D\u044C, \u0434\u043E\u043B\u0436\u043D\u043E\u0441\u0442\u044C, \u043C\u0435\u0441\u0442\u043E \u0440\u0430\u0431\u043E\u0442\u044B \u0438 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0430\u044F \u043F\u043E\u0447\u0442\u0430. \u041A \u0441\u0442\u0430\u0442\u044C\u0435 \u043D\u0430 \u043A\u0430\u0437\u0430\u0445\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0435 \u043F\u0440\u0438\u043B\u0430\u0433\u0430\u044E\u0442\u0441\u044F \u0440\u0435\u0437\u044E\u043C\u0435 \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C, \u043A \u0441\u0442\u0430\u0442\u044C\u0435 \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u2014 \u043D\u0430 \u043A\u0430\u0437\u0430\u0445\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C.","Centre the paper title in bold uppercase letters. Include the author\u2019s full name, academic degree, position, institution and email. Papers in Kazakh require summaries in Russian and English; papers in Russian require summaries in Kazakh and English."],"\u0411\u0430\u0440\u043B\u044B\u049B \u0442\u0430\u043B\u0430\u043F\u0442\u044B \u0430\u049B\u043F\u0430\u0440\u0430\u0442\u0442\u044B\u049B \u0445\u0430\u0442\u0442\u0430\u043D \u049B\u0430\u0440\u0430\u0443":["\u0412\u0441\u0435 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F \u0432 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u043E\u043D\u043D\u043E\u043C \u043F\u0438\u0441\u044C\u043C\u0435","See all requirements in the information letter"],"\u049A\u0430\u0442\u044B\u0441\u0443 \u0436\u0430\u0440\u043D\u0430\u0441\u044B\u043D\u0430 \u043D\u0435 \u043A\u0456\u0440\u0435\u0434\u0456?":["\u0427\u0442\u043E \u0432\u0445\u043E\u0434\u0438\u0442 \u0432 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441?","What does the participation fee include?"],"\u041E\u043D\u043B\u0430\u0439\u043D \u049B\u0430\u0442\u044B\u0441\u0443\u0493\u0430 \u0431\u043E\u043B\u0430 \u043C\u0430?":["\u041C\u043E\u0436\u043D\u043E \u043B\u0438 \u0443\u0447\u0430\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u043E\u043D\u043B\u0430\u0439\u043D?","Can I participate online?"],"\u0418\u04D9. \u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F \u0433\u0438\u0431\u0440\u0438\u0434\u0442\u0456 \u0444\u043E\u0440\u043C\u0430\u0442\u0442\u0430 \u04E9\u0442\u0435\u0434\u0456. \u04E8\u0442\u0456\u043D\u0456\u043C\u0434\u0435 \xAB\u041E\u043D\u043B\u0430\u0439\u043D \u049B\u0430\u0442\u044B\u0441\u0443\xBB \u043D\u04B1\u0441\u049B\u0430\u0441\u044B\u043D \u0442\u0430\u04A3\u0434\u0430\u04A3\u044B\u0437. \u049A\u043E\u0441\u044B\u043B\u0443 \u043C\u04D9\u043B\u0456\u043C\u0435\u0442\u0442\u0435\u0440\u0456\u043D \u0442\u0430\u04A3\u0434\u0430\u0493\u0430\u043D \u0441\u0435\u043A\u0446\u0438\u044F\u04A3\u044B\u0437\u0434\u044B\u04A3 \u04B1\u0439\u044B\u043C\u0434\u0430\u0441\u0442\u044B\u0440\u0443\u0448\u044B\u0441\u044B\u043D\u0430\u043D \u043D\u0430\u049B\u0442\u044B\u043B\u0430\u04A3\u044B\u0437.":["\u0414\u0430. \u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F \u043F\u0440\u043E\u0445\u043E\u0434\u0438\u0442 \u0432 \u0433\u0438\u0431\u0440\u0438\u0434\u043D\u043E\u043C \u0444\u043E\u0440\u043C\u0430\u0442\u0435. \u0412\u04
