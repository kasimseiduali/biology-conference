.anniversary{width:116px;height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:13px;transform:none;right:-16px;top:-12px;text-align:center}
.anniversary strong{font-size:49px;line-height:1;letter-spacing:-3px;padding-right:3px}
.anniversary span{font-size:9px;line-height:1.35;letter-spacing:.035em;max-width:84px;text-align:center}
.language-switch{display:flex;align-items:center;gap:3px;padding-left:17px;border-left:1px solid #d9e1dc;flex-shrink:0}
.language-switch button{background:transparent;color:#66776e;font-size:12px;font-weight:600;padding:8px 7px;min-height:38px;border-radius:3px;transition:background .2s,color .2s}
.language-switch button:hover{background:#edf3ef;color:#173b2e}
.language-switch button.active{background:#0b4536;color:#fff}
html[lang=ru] .hero-copy h1{font-size:clamp(1.8rem,2.65vw,2.7rem)}
html[lang=en] .hero-copy h1{font-size:clamp(1.8rem,2.8vw,2.8rem)}
.header{gap:20px}.nav{gap:20px}
.facts-strip>div,.facts-strip>a{min-width:0}.facts-strip strong{flex-wrap:wrap;line-height:1.45}
@media(max-width:1100px){.nav{gap:12px;font-size:12px}.nav-register{padding:8px 10px}.language-switch{padding-left:10px}.header{gap:12px}}
@media(max-width:900px){.header{height:76px;padding:8px 4%;gap:8px}.university-logo{width:82px;height:50px}.faculty-logo{width:45px;height:45px}.logos{gap:10px}.logo-divider{height:30px}.language-switch{margin-left:auto;padding-left:0;border:0;gap:1px}.language-switch button{padding:8px 6px;font-size:11px}.menu-toggle{display:flex;padding:7px}.nav{display:none;position:absolute;left:0;right:0;top:76px;background:white;padding:25px 6%;border-top:1px solid #e2e7e2;box-shadow:0 20px 30px #12352015}.nav.is-open{display:flex;flex-direction:column;align-items:stretch;font-size:16px;gap:15px}.nav-register{justify-content:space-between}}
@media(max-width:800px){html[lang=ru] .hero-copy h1,html[lang=en] .hero-copy h1{font-size:clamp(1.45rem,4.5vw,2.5rem)}.dedication{line-height:1.45}.hero-copy>.button{max-width:100%}.count-label{flex-shrink:1}.clock{flex-shrink:0}.clock span{font-size:10px}}
@media(max-width:360px){.university-logo{width:70px;height:45px}.faculty-logo{width:40px;height:40px}.logos{gap:7px}.language-switch button{font-size:10px;padding:8px 5px}.header{gap:6px}.hero-copy h1,html[lang=ru] .hero-copy h1,html[lang=en] .hero-copy h1{font-size:1.4rem;line-height:1.2}.hero-copy>.button{font-size:11px;gap:10px}.hero-topline{margin-bottom:12px}.count-label{max-width:115px}.clock{gap:12px}}

u043C\u0430\u043B\u0430\u0440\u044B":["\u0412\u044B\u0441\u0442\u0443\u043F\u043B\u0435\u043D\u0438\u044F \u043F\u0440\u0438\u0433\u043B\u0430\u0448\u0451\u043D\u043D\u044B\u0445 \u0441\u043F\u0438\u043A\u0435\u0440\u043E\u0432","Invited speaker presentations"],"\u0422\u04AF\u0441\u043A\u0456 \u04AF\u0437\u0456\u043B\u0456\u0441":["\u041E\u0431\u0435\u0434\u0435\u043D\u043D\u044B\u0439 \u043F\u0435\u0440\u0435\u0440\u044B\u0432","Lunch break"],"\u0421\u0435\u043A\u0446\u0438\u044F\u043B\u044B\u049B \u043E\u0442\u044B\u0440\u044B\u0441\u0442\u0430\u0440\u0434\u044B\u04A3 \u0436\u04B1\u043C\u044B\u0441\u044B":["\u0420\u0430\u0431\u043E\u0442\u0430 \u0441\u0435\u043A\u0446\u0438\u043E\u043D\u043D\u044B\u0445 \u0437\u0430\u0441\u0435\u0434\u0430\u043D\u0438\u0439","Parallel section sessions"],"\u0411\u0456\u0440\u0456\u043D\u0448\u0456 \u043A\u04AF\u043D\u043D\u0456\u04A3 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D \u0448\u044B\u0493\u0430\u0440\u0443":["\u041F\u043E\u0434\u0432\u0435\u0434\u0435\u043D\u0438\u0435 \u0438\u0442\u043E\u0433\u043E\u0432 \u043F\u0435\u0440\u0432\u043E\u0433\u043E \u0434\u043D\u044F","First-day closing discussion"],"\u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F \u0440\u0435\u0437\u043E\u043B\u044E\u0446\u0438\u044F\u0441\u044B\u043D \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443":["\u041F\u0440\u0438\u043D\u044F\u0442\u0438\u0435 \u0440\u0435\u0437\u043E\u043B\u044E\u0446\u0438\u0438 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438","Adoption of the conference resolution"],"\u049A\u0410\u0422\u042B\u0421\u0423\u0428\u042B\u041B\u0410\u0420\u0492\u0410 \u0410\u049A\u041F\u0410\u0420\u0410\u0422":["\u0418\u041D\u0424\u041E\u0420\u041C\u0410\u0426\u0418\u042F \u0414\u041B\u042F \u0423\u0427\u0410\u0421\u0422\u041D\u0418\u041A\u041E\u0412","INFORMATION FOR PARTICIPANTS"],"\u0416\u0438\u0456 \u049B\u043E\u0439\u044B\u043B\u0430\u0442\u044B\u043D \u0441\u04B1\u0440\u0430\u049B\u0442\u0430\u0440":["\u0427\u0430\u0441\u0442\u043E \u0437\u0430\u0434\u0430\u0432\u0430\u0435\u043C\u044B\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B","Frequently asked questions"],"\u041C\u0430\u049B\u0430\u043B\u0430\u0493\u0430 \u049B\u0430\u043D\u0434\u0430\u0439 \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440 \u049B\u043E\u0439\u044B\u043B\u0430\u0434\u044B?":["\u041A\u0430\u043A\u043E\u0432\u044B \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F \u043A \u0441\u0442\u0430\u0442\u044C\u0435?","What are the paper requirements?"],"\u041A\u04E9\u043B\u0435\u043C\u0456 \u2014 10 \u0431\u0435\u0442\u0442\u0435\u043D \u0430\u0441\u043F\u0430\u0439\u0434\u044B. \u049A\u0430\u0440\u0456\u043F \u2014 Times New Roman, 14 \u043F\u0442; \u0436\u043E\u043B\u0430\u0440\u0430\u043B\u044B\u049B \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B \u2014 1; \u0430\u0431\u0437\u0430\u0446 \u0448\u0435\u0433\u0456\u043D\u0456\u0441\u0456 \u2014 1 \u0441\u043C. \u0411\u0435\u0442 \u0448\u0435\u0442\u0442\u0435\u0440\u0456: \u0436\u043E\u0493\u0430\u0440\u044B \u0436\u04D9\u043D\u0435 \u0442\u04E9\u043C\u0435\u043D \u2014 2 \u0441\u043C, \u0441\u043E\u043B \u0436\u0430\u049B \u2014 3 \u0441\u043C, \u043E\u04A3 \u0436\u0430\u049B \u2014 1 \u0441\u043C.":["\u041E\u0431\u044A\u0451\u043C \u2014 \u043D\u0435 \u0431\u043E\u043B\u0435\u0435 10 \u0441\u0442\u0440\u0430\u043D\u0438\u0446. \u0428\u0440\u0438\u0444\u0442 \u2014 Times New Roman, 14 \u043F\u0442; \u043C\u0435\u0436\u0441\u0442\u0440\u043E\u0447\u043D\u044B\u0439 \u0438\u043D\u0442\u0435\u0440\u0432\u0430\u043B \u2014 1; \u0430\u0431\u0437\u0430\u0446\u043D\u044B\u0439 \u043E\u0442\u0441\u0442\u0443\u043F \u2014 1 \u0441\u043C. \u041F\u043E\u043B\u044F: \u0432\u0435\u0440\u0445\u043D\u0435\u0435 \u0438 \u043D\u0438\u0436\u043D\u0435\u0435 \u2014 2 \u0441\u043C, \u043B\u0435\u0432\u043E\u0435 \u2014 3 \u0441\u043C, \u043F\u0440\u0430\u0432\u043E\u0435 \u2014 1 \u0441\u043C.","Maximum length: 10 pages. Use Times New Roman, 14 pt, single spacing and a 1 cm paragraph indent. Margins: 2 cm top and bottom, 3 cm left and 1 cm right."],"\u041C\u0430\u049B\u0430\u043B\u0430 \u0442\u0430\u049B\u044B\u0440\u044B\u0431\u044B \u0431\u0430\u0441 \u04D9\u0440\u0456\u043F\u0442\u0435\u0440\u043C\u0435\u043D, \u049B\u0430\u043B\u044B\u04A3 \u049B\u0430\u0440\u0456\u043F\u043F\u0435\u043D \u043E\u0440\u0442\u0430\u0493\u0430 \u0442\u0443\u0440\u0430\u043B\u0430\u043D\u0430\u0434\u044B. \u0410\u0432\u0442\u043E\u0440\u0434\u044B\u04A3 \u0430\u0442\u044B-\u0436\u04E9\u043D\u0456, \u0493\u044B\u043B\u044B\u043C\u0438 \u0434\u04D9\u0440\u0435\u0436\u0435\u0441\u0456, \u043B\u0430\u0443\u0430\u0437\u044B\u043C\u044B, \u0436\u04B1\u043C\u044B\u0441 \u043E\u0440\u043D\u044B \u043C\u0435\u043D \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u0434\u044B\u049B \u043F\u043E\u0448\u0442\u0430\u0441\u044B \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043B\u0435\u0434\u0456. \u049A\u0430\u0437\u0430\u049B \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u043C\u0430\u049B\u0430\u043B\u0430\u0493\u0430 \u043E\u0440\u044B\u0441 \u0436\u04D9\u043D\u0435 \u0430\u0493\u044B\u043B\u0448\u044B\u043D \u0442\u0456\u043B\u0434\u0435\u0440\u0456\u043D\u0434\u0435, \u043E\u0440\u044B\u0441 \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u043C\u0430\u049B\u0430\u043B\u0430\u0493\u0430 \u049B\u0430\u0437\u0430\u049B \u0436\u04D9\u043D\u0435 \u0430\u0493\u044B\u043B\u0448\u044B\u043D \u0442\u0456\u043B\u0434\u0435\u0440\u0456\u043D\u0434\u0435 \u0440\u0435\u0437\u044E\u043C\u0435 \u049B\u043E\u0441\u044B\u043B\u0430\u0434\u044B.":["\u041D\u0430\u0437\u0432\u0430\u043D\u0438\u0435 \u0441\u0442\u0430\u0442\u044C\u0438 \u043E\u0444\u043E\u0440\u043C\u043B\u044F\u0435\u0442\u0441\u044F \u043F\u0440\u043E\u043F\u0438\u0441\u043D\u044B\u043C\u0438 \u0431\u0443\u043A\u0432\u0430\u043C\u0438, \u043F\u043E\u043B\u0443\u0436\u0438\u0440\u043D\u044B\u043C \u0448\u0440\u0438\u0444\u0442\u043E\u043C, \u043F\u043E \u0446\u0435\u043D\u0442\u0440\u0443. \u0423\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0424\u0418\u041E \u0430\u0432\u0442\u043E\u0440\u0430, \u0443\u0447\u0451\u043D\u0430\u044F \u0441\u0442\u0435\u043F\u0435\u043D\u044C, \u0434\u043E\u043B\u0436\u043D\u043E\u0441\u0442\u044C, \u043C\u0435\u0441\u0442\u043E \u0440\u0430\u0431\u043E\u0442\u044B \u0438 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0430\u044F \u043F\u043E\u0447\u0442\u0430. \u041A \u0441\u0442\u0430\u0442\u044C\u0435 \u043D\u0430 \u043A\u0430\u0437\u0430\u0445\u0441\u043A\u043E\u043C \u044F\u0437\u044B\u043A\u0435 \u043F\u0440\u0438\u043B\u0430\u0433\u0430\u044E\u0442\u0441\u044F \u0440\u0435\u0437\u044E\u043C\u0435 \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C, \u043A \u0441\u0442\u0430\u0442\u044C\u0435 \u043D\u0430 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u2014 \u043D\u0430 \u043A\u0430\u0437\u0430\u0445\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C.","Centre the paper title in bold uppercase letters. Include the author\u2019s full name, academic degree, position, institution and email. Papers in Kazakh require summaries in Russian and English; papers in Russian require summaries in Kazakh and English."],"\u0411\u0430\u0440\u043B\u044B\u049B \u0442\u0430\u043B\u0430\u043F\u0442\u044B \u0430\u049B\u043F\u0430\u0440\u0430\u0442\u0442\u044B\u049B \u0445\u0430\u0442\u0442\u0430\u043D \u049B\u0430\u0440\u0430\u0443":["\u0412\u0441\u0435 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u044F \u0432 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u043E\u043D\u043D\u043E\u043C \u043F\u0438\u0441\u044C\u043C\u0435 (KZ)","See all requirements in the information letter (KZ)"],"\u049A\u0430\u0442\u044B\u0441\u0443 \u0436\u0430\u0440\u043D\u0430\u0441\u044B\u043D\u0430 \u043D\u0435 \u043A\u0456\u0440\u0435\u0434\u0456?":["\u0427\u0442\u043E \u0432\u0445\u043E\u0434\u0438\u0442 \u0432 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u043E\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441?","What does the participation fee include?"],"3 000 \u0442\u0435\u04A3\u0433\u0435 \u0436\u0430\u0440\u043D\u0430\u0493\u0430 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F\u0493\u0430 \u049B\u0430\u0442\u044B\u0441\u0443 \u0436\u04D9\u043D\u0435 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F\u043B\u044B\u049B \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0434\u0430\u0440 \u043A\u0456\u0440\u0435\u0434\u0456. \u0416\u0430\u0442\u044B\u043D \u043E\u0440\u044B\u043D, \u043A\u04E9\u043B\u0456\u043A \u0448\u044B\u0493\u044B\u043D\u0434\u0430\u0440\u044B \u0436\u04D9\u043D\u0435 \u0431\u0456\u0440\u0433\u0435 \u043A\u0435\u043B\u0435\u0442\u0456\u043D \u0430\u0434\u0430\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u0442\u04E9\u043B\u0435\u043C\u0456 \u043A\u0456\u0440\u043C\u0435\u0439\u0434\u0456. \u0416\u0430\u0440\u043D\u0430 \u049B\u0430\u0442\u044B\u0441\u0443\u044B\u04A3\u044B\u0437 \u0440\u0430\u0441\u0442\u0430\u043B\u0493\u0430\u043D\u043D\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u0442\u04E9\u043B\u0435\u043D\u0435\u0434\u0456. \u0420\u0435\u043A\u0432\u0438\u0437\u0438\u0442\u0442\u0435\u0440 \u0430\u049B\u043F\u0430\u0440\u0430\u0442\u0442\u044B\u049B \u0445\u0430\u0442\u0442\u044B\u04A3 2-\u049B\u043E\u0441\u044B\u043C\u0448\u0430\u0441\u044B\u043D\u0434\u0430 \u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D.":["\u0412\u0437\u043D\u043E\u0441 3 000 \u0442\u0435\u043D\u0433\u0435 \u0432\u043A\u043B\u044E\u0447\u0430\u0435\u0442 \u0443\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0438 \u0438 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u043E\u043D\u043D\u044B\u0435 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B. \u041F\u0440\u043E\u0436\u0438\u0432\u0430\u043D\u0438\u0435, \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u043D\u044B\u0435 \u0440\u0430\u0441\u0445\u043E\u0434\u044B \u0438 \u0440\u0430\u0441\u0445\u043E\u0434\u044B \u0441\u043E\u043F\u0440\u043E\u0432\u043E\u0436\u0434\u0430\u044E\u0449\u0438\u0445 \u043B\u0438\u0446 \u043D\u0435 \u0432\u043A\u043B\u044E\u0447\u0435\u043D\u044B. \u041E\u043F\u043B\u0430\u0442\u0430 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0441\u044F \u043F\u043E\u0441\u043B\u0435 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043D\u0438\u044F \u0443\u0447\u0430\u0441\u0442\u0438\u044F. \u0420\u0435\u043A\u0432\u0438\u0437\u0438\u0442\u044B \u043F\u0440\u0438\u0432\u0435\u0434\u0435\u043D\u044B \u0432 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0438 2 \u043A \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u043E\u043D\u043D\u043E\u043C\u0443 \u043F\u0438\u0441\u044C\u043C\u0443.","The KZT 3,000 fee includes conference participation and conference materials. Accommodation, travel and accompanying persons\u2019 expenses are not included. Pay after your participation is confirmed. Payment details are in Appendix 2 of the information letter."],"\u041E\u043D\u043B\u0430\u0439\u043D \u049B\u0430\u0442\u044B\u0441\u0443\u0493\u0430 \u0431\u043E\u043B\u0430 \u043C\u0430?":["\u041C\u043E\u0436\u043D\u043E \u043B\u0438 \u0443\u0447\u0430\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u043E\u043D\u043B\u0430\u0439\u043D?","Can I participate online?"],"\u0418\u04D9. \u041A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u044F \u0433\u0438\u0431\u0440\u0438\u0434\u0442\u0456 \u0444\u043E\u0440\u043C\u0430\u0442\u0442\u0430 \u04E9\u0442\u0435\u0434\u0456. \u04E8\u0442\u0456\u043D\u0456\u043C\u0434\u0435 \xAB\u041E\u043D\u043B\u0430\u0439\u043D \u049B\u0430\u0442\u044B\u0441\u0443\xBB \u043D\u04B1\u0441\u049B\u0430\u0441\u044B\u043D \u0442\u0430\u04A3\u0434\u0430\u04A3\u044B\u0437. \u049A\u043E\u0441\u044B\u043B\u0443 \u043C\u04D9\u043B\u0456\u043C\u0435\u0442\
